<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>授業の録画｜8週間 試験対策講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#f26b3b;--brown:#553727;--bg:#f9f7ef;--blue:#0085c9;--sub:#85634b;--line:rgba(85,55,39,.18);--pale:#fdeee8;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--brown);line-height:1.85;-webkit-font-smoothing:antialiased;min-height:100vh}
header{background:#fff;border-top:6px solid var(--orange);border-bottom:1px solid var(--line);padding:12px 16px}
header .in{max-width:760px;margin:0 auto}
header .lb{font-size:11px;letter-spacing:.1em;color:var(--sub)}
header h1{font-family:"Zen Old Mincho",serif;font-size:19px;font-weight:700;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px 16px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-bottom:14px}
h2{font-family:"Zen Old Mincho",serif;font-size:20px;font-weight:700;line-height:1.5;margin-bottom:8px}
p{margin-bottom:10px;font-size:15px}
.note{font-size:13px;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:10px 0}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=password]{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--brown)}
input:focus{outline:none;border-color:var(--orange)}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:1em}
.tag{display:inline-block;background:var(--pale);color:var(--orange);font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;margin:0 6px 8px 0}
.tag.g{background:var(--bg);color:var(--sub)}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:10px 0 8px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{color:var(--blue);font-weight:500}
.until{display:inline-block;background:var(--pale);color:#b5481f;font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<header><div class="in"><div class="lb">8週間 試験対策講座</div><h1>授業の録画</h1></div></header>
<main id="app"></main>
<script>
const BLOB={"s":"P9lY0fUHw1OHDLeXYpkqbA==","i":"fer0g7RKh5u5LoFW","d":"5XW/k8bLyZmgnf0VmKHCIJ3D16QzBmMa06XWwczn2+J0UHLL/b2+NkyG519DOks4H8c0jpPfCnawuMrA8J2gGNYnaLhaiK2q2mFgG3RvPQth5zPFVEyWiUmUi7oibo+YgzySiqty6QNscokoWyszSXPXeQexzHNThUehVDFvDyKA3KyFLqQJnJeGvGMeIWjB2JYhlTX6r9I2sac1kJGhtYUzFvOW8X1qLU3smICSr6dETxvB47JGVxfJCuqJ4v0aQEz1BxfJVNeBoPrS1A59mkPCAsFtOVuQogTcjIA6WHhxo/p5z6TTdKmqbKeC2sH5Iera4AsZqbl3st43Z5P2zGdNp+2nzT4TGpHWsOh4t9H/UQtUS47jI3DaPaLY6rp6UHKJu2/I8MDzUkLEq5ugRuvQaNLc63Gx+yeyFy4mLWHRf6UyTnVyUjKAcn7p0Hw6+pRq+0hFDTm6BwgDR0Zn3IlAHuBWbMUIZlOQm1mtcfqGJIrUxcSiJk3tvl8ySxxx+e1Pq5raTRTxExxQ1lArMgb0npwLkKXBKCgTnl1zTRQV54KFawRLM6pEIPJ4gWnYpKj4EWULKptpNf+OMohk43lNxWka0Jpck7Kgwrc+KyPPnqqFjxr33rZcwmwWfWd8I3N90Ux+Gd4l7GlIyA87W7eKdlF2EDBBi8jhFSvnlKoybRx035wzXQyOlr74kGSBlfijuY851ccMX3sN2gyzY5xsoxJc47wsZEO42WzUVF9VkrdhWe/zecJKBB2Cdir0nm9+AkIWnUG24arvaEPKDDqsr//yuaDOXjAC6NQ2wr2CyGFDU5Y45NRVNrSMotRfNCxp0j6r0jx876c4zwdwLyRh061SA27IAvB0o/CHyOhnGonxLKk4KIC1O/KInSCNaLNeueDgGQnC2YQSSetGQBuoEdkMxKVjICjbWj5FSMddS/5BiUJESTFyt7BlO82D2mZwysCVHaaUhHAFGm5/lnMNhjA7KyDobxy+qs86X8g="};
const END=Date.parse("2026-12-20T23:59:59+09:00"); // 試験の最終日の終わりまで（日本時間）
const app=document.getElementById("app");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function unlock(pass){
  const enc=new TextEncoder(), base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(BLOB.s),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(BLOB.i)},key,ub(BLOB.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
const dj=d=>{const x=new Date(d+"T12:00:00+09:00");return (x.getMonth()+1)+"月"+x.getDate()+"日（"+"日月火水木金土"[x.getDay()]+"）";};
function renderEnded(){app.innerHTML=`<div class="card"><h2>視聴できる期間は終わりました</h2><p>授業の録画は、試験の最終日（12月20日）までのご案内でした。ご視聴ありがとうございました。</p><p class="note">お問い合わせ：school@iob.bio</p></div>`;}
function renderGate(msg){app.innerHTML=`<div class="card"><h2>パスワードを入れてください</h2>
  <p>授業の録画を見られるページです。BANDでお伝えしたパスワードを入れてください。</p>
  <label class="f" for="pw">パスワード</label><input type="password" id="pw" autocomplete="off">
  <div class="err" id="er">${msg||""}</div><button class="btn" id="go">ひらく</button></div>`;
  const go=async()=>{const p=document.getElementById("pw").value.trim();if(!p)return;try{const v=await unlock(p);store.set("v8_pass",p);renderList(v);}catch(e){document.getElementById("er").textContent="パスワードが合いません。もう一度入れてください。";}};
  document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go();};}
function renderList(v){
  v=v.slice().sort((a,b)=>b.no-a.no);
  app.innerHTML=`<div class="card"><h2>授業の録画</h2><div class="until">見られるのは 12月20日（日）23:59 まで</div>
    <p>授業のあと、毎回ここに録画を足していきます。欠席した回や、もう一度聞きたいところの復習にお使いください。</p>
    <p class="note">動画が出ないときは、各動画の下の「新しいタブで開く」から見られます。</p></div>`+
  v.map(x=>`<div class="card"><span class="tag">第${x.no}回</span><span class="tag g">${dj(x.date)}</span>
    <h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p>
    <div class="vid"><iframe src="https://drive.google.com/file/d/${esc(x.drive)}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>
    <p style="font-size:13px"><a href="https://drive.google.com/file/d/${esc(x.drive)}/view" target="_blank" rel="noopener">新しいタブで開く</a></p></div>`).join("");
  window.scrollTo(0,0);}
(async()=>{
  if(Date.now()>END)return renderEnded();
  const h=new URLSearchParams((location.hash||"").slice(1)), hp=h.get("p");
  if(hp){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    try{const v=await unlock(hp);store.set("v8_pass",hp);return renderList(v);}catch(e){}}
  const sp=store.get("v8_pass");
  if(sp){try{return renderList(await unlock(sp));}catch(e){}}
  renderGate();
})();
</script>
</body>
</html>
